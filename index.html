<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Avión - Defiende los Cielos de Cartulina</title>
    
    <!-- Metadatos de SEO -->
    <meta name="description" content="Dulce Avión es un divertido juego arcade en 3D. Pilotea un avión de papel y cartulina, esquiva obstáculos y sobrevive en este mundo mágico.">
    <meta name="keywords" content="juego, 3d, three.js, avión, cartulina, webgl, arcade, volar, dulce">
    <meta name="author" content="Ramoncito">
    
    <!-- Open Graph (Redes Sociales) -->
    <meta property="og:title" content="Dulce Avión - Juego 3D">
    <meta property="og:description" content="Pilotea tu avión de cartón y defiende los cielos en este emocionante juego 3D en el navegador.">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
    <!-- Incluir Three.js desde un CDN (versión moderna) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="aviator" id="world"></div>
    
    <!-- PANTALLA DE BIENVENIDA -->
    <div id="welcome-screen">
        <div class="board">
            <h1>DULCE AVIÓN</h1>
            <p>Defiende los Cielos de Cartulina</p>
            <div class="level-select-container">
                <label for="start-level-select">Elegir Nivel:</label>
                <select id="start-level-select">
                    <option value="1">1. Día Claro</option>
                    <option value="2">2. Atardecer Rojo</option>
                    <option value="3">3. Noche Oscura</option>
                    <option value="4">4. Tormenta Final</option>
                </select>
            </div>
            <button id="start-btn">START ENGINE</button>
        </div>
    </div>
    
    <!-- MENSAJE DE SUBIDA DE NIVEL -->
    <div id="level-up-message" class="hidden">
        <h1 id="level-text">NIVEL 2</h1>
        <p id="level-subtext">ATARDECER</p>
    </div>
    
    <!-- MODAL DE AJUSTES -->
    <div id="settings-modal" class="hidden">
        <div class="board">
            <h2>AJUSTES DE VUELO</h2>
            
            <div class="setting-row">
                <label>Silenciar Música</label>
                <input type="checkbox" id="mute-music-chk">
            </div>
            
            <div class="setting-row">
                <label>Silenciar Efectos (SFX)</label>
                <input type="checkbox" id="mute-sfx-chk">
            </div>
            
            <div class="setting-row">
                <label>Color del Avión</label>
                <select id="plane-color-select">
                    <option value="1">1. Original (Rojo)</option>
                    <option value="2">2. Argentina</option>
                    <option value="3">3. Bolivia</option>
                    <option value="4">4. Stealth Negro</option>
                    <option value="5">5. Fuego</option>
                    <option value="6">6. Militar</option>
                    <option value="7">7. Oceánico</option>
                    <option value="8">8. Neón Cyberpunk</option>
                    <option value="9">9. Dorado Imperial</option>
                </select>
            </div>
            
            <div class="setting-row">
                <label>Pista de Audio</label>
                <select id="track-select">
                    <option value="0">1. Épica Original</option>
                    <option value="1">2. Lamento de la Puna (Triste)</option>
                    <option value="2">3. Vuelo Solitario (Triste)</option>
                    <option value="3">4. Carnavalito en las Nubes (Alegre)</option>
                    <option value="4">5. Caporal del Cielo (Alegre)</option>
                    <option value="5">6. Nazca Espacial (Misterio/Alien)</option>
                    <option value="6">7. Contacto en los Andes (Misterio/Alien)</option>
                </select>
            </div>
            
            <button id="close-settings-btn">CERRAR</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
