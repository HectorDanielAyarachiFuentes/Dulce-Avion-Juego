<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo (cielo) -->
  <rect width="100" height="100" rx="25" fill="#3b5764" />
  
  <!-- Cuerpo del avión -->
  <path d="M 20 50 C 20 40, 80 40, 85 50 C 80 60, 20 60, 20 50 Z" fill="#f25346" />
  
  <!-- Cabina -->
  <path d="M 60 43 Q 70 43, 75 50 L 60 50 Z" fill="#d8d0d1" />
  
  <!-- Ala superior -->
  <path d="M 40 50 L 30 20 L 55 20 L 60 50 Z" fill="#d8d0d1" />
  
  <!-- Ala inferior -->
  <path d="M 40 50 L 30 80 L 55 80 L 60 50 Z" fill="#b8afb0" />
  
  <!-- Cola -->
  <path d="M 25 50 L 15 35 L 35 35 L 30 50 Z" fill="#f25346" />
  
  <!-- Base de la hélice -->
  <rect x="85" y="45" width="5" height="10" fill="#23190f" />
  
  <!-- Hélice -->
  <ellipse cx="90" cy="50" rx="2" ry="25" fill="#59332e" />
  
  <!-- Brillo / Sombra para el estilo de cartulina -->
  <path d="M 22 50 C 22 42, 78 42, 83 50 Z" fill="#ff6859" opacity="0.6" />
</svg>
